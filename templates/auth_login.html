{% extends "base.html" %}
{% block title %}로그인 | IdolAlive Statistics{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <!-- 헤더 -->
    <div class="auth-card__header">
      <h1 class="auth-card__title">로그인</h1>
      <p class="auth-card__sub">IdolAlive Statistics에 오신 것을 환영합니다</p>
    </div>

    <!-- 폼 -->
    <form method="post" action="{% url 'viewersPage:login' %}" novalidate>
      {% csrf_token %}

      <!-- next 파라미터 보존 (로그인 후 원래 페이지로 복귀) -->
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <div class="form-group">
        <label class="form-label" for="id_username">아이디</label>
        <input
          class="form-input"
          type="text"
          id="id_username"
          name="username"
          value="{{ username_input|default:'' }}"
          placeholder="아이디를 입력하세요"
          autocomplete="username"
          autofocus
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">
          비밀번호
          <a href="#" class="form-label__link" tabindex="-1">비밀번호를 잊으셨나요?</a>
        </label>
        <div class="form-input-wrap">
          <input
            class="form-input"
            type="password"
            id="id_password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
            required
          >
          <button type="button" class="form-input__eye" id="togglePw" aria-label="비밀번호 표시/숨기기">
            <!-- 눈 아이콘 (SVG inline) -->
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full">로그인</button>
    </form>

    <div class="auth-card__footer">
      <span>아직 계정이 없으신가요?</span>
      <a href="{% url 'viewersPage:signup' %}">회원가입</a>
    </div>

  </div>
</div>

<style>
/* ── 인증 페이지 전용 스타일 ── */
.auth-wrap {
  min-height: calc(100vh - var(--nav-h) - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}
.auth-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1.5px solid var(--border-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 2.5rem 2rem;
}
.auth-card__header { text-align: center; margin-bottom: 2rem; }
.auth-card__title  { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.4rem; }
.auth-card__sub    { font-size: 0.88rem; color: var(--text-secondary); }

.form-group { margin-bottom: 1.2rem; }
.form-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.4rem;
}
.form-label__link { font-weight: 400; color: var(--ial-lavender); font-size: 0.82rem; }
.form-label__link:hover { text-decoration: underline; }

.form-input-wrap { position: relative; }
.form-input {
  width: 100%;
  padding: 0.65rem 0.9rem;
  background: var(--bg-page);
  border: 1.5px solid var(--border-card);
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color 0.18s, box-shadow 0.18s;
  outline: none;
}
.form-input:focus {
  border-color: var(--ial-lavender);
  box-shadow: 0 0 0 3px rgba(155,165,212,0.15);
}
.form-input-wrap .form-input { padding-right: 2.8rem; }
.form-input__eye {
  position: absolute;
  right: 0.8rem;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 2px;
  display: flex;
  align-items: center;
}
.form-input__eye:hover { color: var(--text-primary); }

.btn--full { width: 100%; margin-top: 0.5rem; padding: 0.75rem; font-size: 1rem; border-radius: var(--radius-sm); }
.auth-card__footer {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.88rem;
  color: var(--text-secondary);
}
.auth-card__footer a { color: var(--ial-lavender); font-weight: 600; margin-left: 4px; }
.auth-card__footer a:hover { text-decoration: underline; }
</style>

<script>
/* 비밀번호 표시/숨기기 */
document.getElementById('togglePw').addEventListener('click', function () {
  const input = document.getElementById('id_password');
  const icon  = document.getElementById('eyeIcon');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  /* 눈 아이콘 슬래시 토글 */
  icon.innerHTML = isHidden
    ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
       <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
       <line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
});
</script>
{% endblock %}
