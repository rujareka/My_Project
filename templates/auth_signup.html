{% extends "base.html" %}
{% block title %}회원가입 | IdolAlive Statistics{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <!-- 헤더 -->
    <div class="auth-card__header">
      <h1 class="auth-card__title">회원가입</h1>
      <p class="auth-card__sub">덱을 만들고 통계를 기록해보세요</p>
    </div>

    <!-- 폼 -->
    <form method="post" action="{% url 'viewersPage:signup' %}" novalidate id="signupForm">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="id_username">아이디</label>
        <input
          class="form-input"
          type="text"
          id="id_username"
          name="username"
          value="{{ username_input|default:'' }}"
          placeholder="영문/숫자 3~20자"
          autocomplete="username"
          autofocus
          required
          minlength="3"
          maxlength="20"
          pattern="[A-Za-z0-9]+"
        >
        <p class="form-hint">영문자와 숫자만 사용 가능 (3~20자)</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">비밀번호</label>
        <div class="form-input-wrap">
          <input
            class="form-input"
            type="password"
            id="id_password"
            name="password"
            placeholder="8자 이상"
            autocomplete="new-password"
            required
            minlength="8"
          >
          <button type="button" class="form-input__eye" id="togglePw1" aria-label="비밀번호 표시/숨기기">
            <svg id="eyeIcon1" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <!-- 비밀번호 강도 바 -->
        <div class="pw-strength-wrap">
          <div class="pw-strength-bar" id="pwStrengthBar"></div>
        </div>
        <p class="form-hint" id="pwStrengthText"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_confirm">비밀번호 확인</label>
        <div class="form-input-wrap">
          <input
            class="form-input"
            type="password"
            id="id_confirm"
            name="confirm"
            placeholder="비밀번호를 다시 입력하세요"
            autocomplete="new-password"
            required
          >
          <button type="button" class="form-input__eye" id="togglePw2" aria-label="비밀번호 표시/숨기기">
            <svg id="eyeIcon2" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="form-hint" id="confirmHint" style="display:none;"></p>
      </div>

      <button type="submit" class="btn btn--primary btn--full" id="submitBtn">가입하기</button>
    </form>

    <div class="auth-card__footer">
      <span>이미 계정이 있으신가요?</span>
      <a href="{% url 'viewersPage:login' %}">로그인</a>
    </div>

  </div>
</div>

<style>
/* ── 인증 공통 (login.html 과 동일) ── */
.auth-wrap {
  min-height: calc(100vh - var(--nav-h) - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}
.auth-card {
  width: 100%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1.5px solid var(--border-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 2.5rem 2rem;
}
.auth-card__header { text-align: center; margin-bottom: 2rem; }
.auth-card__title  { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.4rem; }
.auth-card__sub    { font-size: 0.88rem; color: var(--text-secondary); }

.form-group { margin-bottom: 1.2rem; }
.form-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.4rem;
}
.form-hint { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.3rem; }
.form-hint.error  { color: #e8457a; }
.form-hint.ok     { color: #4caf7d; }

.form-input-wrap { position: relative; }
.form-input {
  width: 100%;
  padding: 0.65rem 0.9rem;
  background: var(--bg-page);
  border: 1.5px solid var(--border-card);
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  color: var(--text-primary);
  font-family: inherit;
  transition: border-color 0.18s, box-shadow 0.18s;
  outline: none;
}
.form-input:focus {
  border-color: var(--ial-lavender);
  box-shadow: 0 0 0 3px rgba(155,165,212,0.15);
}
.form-input.is-error { border-color: #e8457a; }
.form-input.is-ok    { border-color: #4caf7d; }
.form-input-wrap .form-input { padding-right: 2.8rem; }
.form-input__eye {
  position: absolute;
  right: 0.8rem;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 2px;
  display: flex;
  align-items: center;
}
.form-input__eye:hover { color: var(--text-primary); }

/* 비밀번호 강도 바 */
.pw-strength-wrap {
  height: 4px;
  background: var(--border-light);
  border-radius: 99px;
  margin-top: 0.4rem;
  overflow: hidden;
}
.pw-strength-bar {
  height: 100%;
  width: 0%;
  border-radius: 99px;
  transition: width 0.3s, background 0.3s;
}

.btn--full { width: 100%; margin-top: 0.5rem; padding: 0.75rem; font-size: 1rem; border-radius: var(--radius-sm); }
.auth-card__footer {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.88rem;
  color: var(--text-secondary);
}
.auth-card__footer a { color: var(--ial-lavender); font-weight: 600; margin-left: 4px; }
.auth-card__footer a:hover { text-decoration: underline; }
</style>

<script>
/* ── 비밀번호 표시/숨기기 ── */
function makeToggle(btnId, inputId, iconId) {
  document.getElementById(btnId).addEventListener('click', function () {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });
}
makeToggle('togglePw1', 'id_password', 'eyeIcon1');
makeToggle('togglePw2', 'id_confirm',  'eyeIcon2');

/* ── 비밀번호 강도 측정 ── */
document.getElementById('id_password').addEventListener('input', function () {
  const pw  = this.value;
  const bar = document.getElementById('pwStrengthBar');
  const txt = document.getElementById('pwStrengthText');
  let score = 0;
  if (pw.length >= 8)                    score++;
  if (pw.length >= 12)                   score++;
  if (/[A-Z]/.test(pw))                  score++;
  if (/[0-9]/.test(pw))                  score++;
  if (/[^A-Za-z0-9]/.test(pw))          score++;

  const levels = [
    { pct: '0%',   color: '',          text: '' },
    { pct: '25%',  color: '#e8457a',   text: '매우 약함' },
    { pct: '50%',  color: '#e8a020',   text: '약함' },
    { pct: '75%',  color: '#a8c020',   text: '보통' },
    { pct: '90%',  color: '#4caf7d',   text: '강함' },
    { pct: '100%', color: '#1e9060',   text: '매우 강함' },
  ];
  const lv = levels[score] || levels[0];
  bar.style.width      = pw.length ? lv.pct : '0%';
  bar.style.background = lv.color;
  txt.textContent      = pw.length ? lv.text : '';
  txt.className = 'form-hint';
});

/* ── 비밀번호 일치 확인 ── */
document.getElementById('id_confirm').addEventListener('input', function () {
  const pw  = document.getElementById('id_password').value;
  const hint = document.getElementById('confirmHint');
  if (!this.value) { hint.style.display = 'none'; return; }
  hint.style.display = 'block';
  if (this.value === pw) {
    hint.textContent = '비밀번호가 일치합니다.';
    hint.className = 'form-hint ok';
    this.classList.add('is-ok');
    this.classList.remove('is-error');
  } else {
    hint.textContent = '비밀번호가 일치하지 않습니다.';
    hint.className = 'form-hint error';
    this.classList.add('is-error');
    this.classList.remove('is-ok');
  }
});

/* ── 클라이언트 사이드 최종 제출 검사 ── */
document.getElementById('signupForm').addEventListener('submit', function (e) {
  const pw  = document.getElementById('id_password').value;
  const cfm = document.getElementById('id_confirm').value;
  if (pw !== cfm) {
    e.preventDefault();
    document.getElementById('confirmHint').textContent = '비밀번호가 일치하지 않습니다.';
    document.getElementById('confirmHint').className   = 'form-hint error';
    document.getElementById('confirmHint').style.display = 'block';
    document.getElementById('id_confirm').focus();
  }
});
</script>
{% endblock %}
